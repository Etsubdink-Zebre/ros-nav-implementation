# Named locations for hospital delivery navigation.
# Format:  name: [x, y, yaw_degrees]

locations:
  origin:        [ 0.0,   0.0,   0.0]
  room_a:        [ 2.5,   0.0,   0.0]
  room_b:        [ 2.5,   2.5,  90.0]
  room_c:        [ 0.0,   2.5, 180.0]
  hallway:       [ 1.25,  1.25, 45.0]
  charging_dock: [-1.0,   0.0, 180.0]

  # ── Hospital Delivery Locations ──
  supply_room:   [-8.0,   0.0,   0.0]     # Supply storage area
  patient_room1: [ 8.0,   6.0, 180.0]     # Patient Room 101
  patient_room2: [ 8.0,  -6.0, 180.0]     # Patient Room 102
  nurse_station: [-2.0,   3.0,  90.0]     # Nurse station / Reception center
  reception:     [-2.0,   3.0,  90.0]     # Alias for nurse_station (reception center)
  pharmacy:      [ 2.0,  -8.0,   0.0]     # Pharmacy pickup
